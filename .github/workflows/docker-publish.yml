# ──────────────────────────────────────────────────────────────────────────────
# CI/CD — MarsaBot Factory
# Déclenché sur chaque push vers la branche main.
# Construit et publie les images Docker du backend et du frontend sur Docker Hub.
# ──────────────────────────────────────────────────────────────────────────────

name: Build & Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # -- 0. Garde-fou : tests et verifications avant toute publication --------
  # Les deux jobs de publication en dependent (needs). Si une seule de ces
  # etapes echoue, aucune image n est construite ni poussee sur Docker Hub.
  tests:
    name: Tests & verifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # -- Backend : suite de tests (bloquant) --
      # Chromium n est pas telecharge : les tests tournent sans navigateur.
      - name: Backend - Installer les dependances
        working-directory: ./backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Backend - Tests unitaires
        working-directory: ./backend
        run: npm test

      # -- Frontend : compilation (bloquant) --
      - name: Frontend - Installer les dependances
        working-directory: ./frontend
        run: npm ci

      - name: Frontend - Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Frontend - Build
        working-directory: ./frontend
        run: npm run build


  # ── 1. Build & Push Backend ────────────────────────────────────────────────
  build-backend:
    name: Backend — Build & Push
    runs-on: ubuntu-latest
    needs: tests

    steps:
      # Récupérer le code source
      - name: Checkout repository
        uses: actions/checkout@v5

      # Se connecter à Docker Hub avec les secrets GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Activer BuildKit pour des builds plus rapides (cache, multi-platform)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Construire et pousser l'image backend
      - name: Build & Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/marsabot-backend:latest
          # Cache entre les runs pour accélérer les builds suivants
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Build & Push Frontend ───────────────────────────────────────────────
  build-frontend:
    name: Frontend — Build & Push
    runs-on: ubuntu-latest
    needs: tests

    steps:
      # Récupérer le code source
      - name: Checkout repository
        uses: actions/checkout@v5

      # Se connecter à Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Activer BuildKit
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Construire et pousser l'image frontend (multi-stage : Vite → Nginx)
      - name: Build & Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/marsabot-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
